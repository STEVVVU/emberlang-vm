name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # A test runner that discovers nothing still exits 0, so a refactor that stops
  # tests being collected would pass CI silently. Assert the count instead.
  # Raise this when tests are added; it is a floor, not an exact count.
  MIN_TESTS: 41

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

      # Runs the suite and guards against a vacuous pass in one step: count the
      # tests that actually reported a result and fail if the suite shrank.
      # `cargo test` exits 0 on "0 passed", which is how a silently-empty suite
      # would otherwise stay green.
      #
      # `--all-targets` also builds the benches, so a bench that stops compiling
      # fails here rather than at release time.
      #
      # This deliberately does not run `cargo test` twice. `pipefail` means a test
      # failure still fails the step even though cargo's exit status is consumed by
      # the pipe, so a single run covers both "the tests pass" and "there are
      # enough of them".
      - name: Test and assert the suite is not empty
        shell: bash
        run: |
          set -euo pipefail
          # Summed with awk, not bc: bc is not installed on the Windows runner.
          total=$(cargo test --all-targets 2>&1 | tee /dev/stderr \
            | awk '/^test result: ok\./ { sum += $4 } END { print sum + 0 }')
          echo "tests passed: ${total} (floor: ${MIN_TESTS})"
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Expected at least ${MIN_TESTS} passing tests, saw ${total}." \
                 "Either tests were removed or they stopped being discovered."
            exit 1
          fi

      # Snapshots are committed, so `cargo test` verifies them. This additionally
      # fails if a snapshot was left stale or an `.snap.new` was committed.
      - name: Assert no snapshot drifted
        shell: bash
        run: |
          set -euo pipefail
          if ls tests/snapshots/*.snap.new >/dev/null 2>&1; then
            echo "::error::Uncommitted snapshot changes (*.snap.new) are present."
            exit 1
          fi
          git diff --exit-code -- tests/snapshots

      # Diagnostics are rendered ASCII-only and escape-free so the same snapshot
      # verifies on Linux and Windows. Assert that on the committed bytes, not
      # just in the test suite: an ANSI escape or box-drawing character reaching a
      # snapshot is what made these platform-dependent before.
      - name: Assert snapshots are platform-independent bytes
        shell: bash
        run: |
          set -euo pipefail
          if grep -rlP '\x1b' tests/snapshots tests/golden 2>/dev/null | grep .; then
            echo "::error::ANSI escape byte found in a committed snapshot or golden file."
            exit 1
          fi
          if grep -rlP '[^\x00-\x7f]' tests/snapshots tests/golden 2>/dev/null | grep .; then
            echo "::error::Non-ASCII byte (box drawing?) found in a committed snapshot."
            exit 1
          fi
          echo "snapshots are pure ASCII with no escapes"

      - run: cargo build --release

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The committed-evidence harness. Timings from a shared runner are not
      # meaningful, so this only proves the harness still runs and emits JSON.
      - name: Run the benchmark harness
        run: cargo run --release --bin benchmark | tee result.json
      - name: Assert it emitted well-formed JSON with the expected fields
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('result.json'))
          required = [
              'schema', 'profile', 'source_bytes', 'compile_iterations',
              'compile_min_us', 'compile_median_us', 'compile_p95_us',
              'bytecode_instructions', 'constants_folded',
              'dead_instructions_removed', 'vm_total_steps',
              'vm_steps_per_second',
          ]
          missing = [k for k in required if k not in d]
          assert not missing, f'benchmark JSON lost fields: {missing}'
          # Deterministic properties of the compiler, not of the clock: these must
          # not drift. Timings are deliberately NOT asserted -- see benchmarks/README.md.
          assert d['bytecode_instructions'] == 336, d['bytecode_instructions']
          assert d['constants_folded'] == 402, d['constants_folded']
          assert d['dead_instructions_removed'] == 722, d['dead_instructions_removed']
          assert d['vm_total_steps'] == 5000400, d['vm_total_steps']
          print('benchmark output OK; deterministic counters unchanged')
          PY

      # Criterion suites: compiled and executed once each via `--test`, never
      # timed. This catches a bench that stopped compiling or started panicking.
      - name: Smoke-run the criterion benches
        run: cargo bench -- --test
