name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # A test runner that discovers nothing still exits 0, so a refactor that stops
  # tests being collected would pass CI silently. Assert the count instead.
  # Raise this when tests are added; it is a floor, not an exact count.
  MIN_TESTS: 41

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

      # Runs the suite and guards against a vacuous pass in one step: count the
      # tests that actually reported a result and fail if the suite shrank.
      # `cargo test` exits 0 on "0 passed", which is how a silently-empty suite
      # would otherwise stay green.
      #
      # `--all-targets` also builds the benches, so a bench that stops compiling
      # fails here rather than at release time.
      #
      # This deliberately does not run `cargo test` twice. `pipefail` means a test
      # failure still fails the step even though cargo's exit status is consumed by
      # the pipe, so a single run covers both "the tests pass" and "there are
      # enough of them".
      - name: Test and assert the suite is not empty
        shell: bash
        run: |
          set -euo pipefail
          # Summed with awk, not bc: bc is not installed on the Windows runner.
          total=$(cargo test --all-targets 2>&1 | tee /dev/stderr \
            | awk '/^test result: ok\./ { sum += $4 } END { print sum + 0 }')
          echo "tests passed: ${total} (floor: ${MIN_TESTS})"
          if [ "${total}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Expected at least ${MIN_TESTS} passing tests, saw ${total}." \
                 "Either tests were removed or they stopped being discovered."
            exit 1
          fi

      # Snapshots are committed, so `cargo test` verifies them. This additionally
      # fails if a snapshot was left stale or an `.snap.new` was committed.
      - name: Assert no snapshot drifted
        shell: bash
        run: |
          set -euo pipefail
          if ls tests/snapshots/*.snap.new >/dev/null 2>&1; then
            echo "::error::Uncommitted snapshot changes (*.snap.new) are present."
            exit 1
          fi
          git diff --exit-code -- tests/snapshots

      # Diagnostics are rendered ASCII-only and escape-free so the same snapshot
      # verifies on Linux and Windows. Assert that on the committed bytes, not
      # just in the test suite: an ANSI escape or box-drawing character reaching a
      # snapshot is what made these platform-dependent before. CR and BOM are
      # covered too -- CR especially, since it is ASCII and so invisible to the
      # other two scans, and it is what a `core.autocrlf=true` clone introduces.
      #
      # `benchmarks/results-windows-x86_64.json` is scanned alongside the snapshots
      # because it is parsed, not just compared, so a stray byte there breaks the
      # parse rather than a diff.
      #
      # Reads the bytes in Python rather than with `grep -P`: on the Windows runner
      # that grep strips CR before matching and cannot match non-UTF-8 bytes at
      # all, which made the shell form of these checks a silent no-op. The script
      # documents each failure mode.
      - name: Assert committed fixtures are platform-independent bytes
        shell: bash
        run: python3 scripts/check_fixture_bytes.py

      # The published figures live in exactly one place -- the committed benchmark
      # artifact -- and this asserts that the artifact, the README tables, and the
      # running prose all still agree. Previously these constants were duplicated
      # into this workflow; see scripts/check_documented_metrics.py.
      - name: Assert the documented metrics match the artifact
        shell: bash
        run: python3 scripts/check_documented_metrics.py

      - run: cargo build --release

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The committed-evidence harness. Timings from a shared runner are not
      # meaningful, so this only proves the harness still runs and emits JSON.
      # Written with a redirect rather than `tee`: nothing reads the harness output
      # on the console, and the file is the artifact under test.
      - name: Run the benchmark harness
        run: cargo run --release --bin benchmark > result.json

      # Asserts the JSON is well-formed, kept its required fields, and reproduced
      # the deterministic compiler counters -- read from the committed artifact
      # rather than restated here, so 336/402/722/5000400 live in exactly one file.
      # Timings are deliberately NOT asserted; see benchmarks/README.md.
      - name: Assert it reproduced the committed deterministic counters
        run: python3 scripts/check_documented_metrics.py result.json

      # Criterion suites: compiled and executed once each via `--test`, never
      # timed. This catches a bench that stopped compiling or started panicking.
      - name: Smoke-run the criterion benches
        run: cargo bench -- --test
